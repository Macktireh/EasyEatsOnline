[project]
name = "EasyEatsOnline"
version = "0.1.0"
description = "EasyEatsOnline is an online food service project based on Flask and Flask-RESTx, providing a user-friendly and simplified culinary experience. The project is designed with an architecture inspired by Spring Boot, ensuring a robust and modular structure for development. PostgreSQL is used as the database to store essential information. Key technical features of EasyEatsOnline include efficient RESTful APIs for managing menus, orders, and users, a robust PostgreSQL database for data storage, secure authentication, a user-friendly interface, and advanced features for searching restaurants and menus. This project aims to streamline the online meal ordering process, offering users a quick and convenient solution to satisfy their culinary cravings."
authors = [{ name = "Macktireh", email = "abdimack97@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# dependencies = [
#     "flask-admin>=1.6.1",
#     "flask-bcrypt>=1.0.1",
#     "flask-jwt-extended>=4.6.0",
#     "flask-login>=0.6.3",
#     "flask-migrate>=4.0.7",
#     "flask-restx>=1.3.0",
#     "flask-sqlalchemy>=3.1.1",
#     "psycopg[binary]>=3.2.3",
#     "python-dotenv>=1.0.1",
#     "python-slugify>=8.0.4",
#     "werkzeug>=3.1.3",
# ]
dependencies = [
    "flask>=3.1.1",
    "flask-admin>=1.6.1",
    "flask-bcrypt>=1.0.1",
    "flask-jwt-extended>=4.7.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-restx>=1.3.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.1.1",
    "python-slugify>=8.0.4",
    "werkzeug>=3.1.3",
    "wtforms==3.1.2"
]

[dependency-groups]
lint = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.5",
]
test = [
    "coverage>=7.10.1",
    "faker>=37.4.2",
    "flask-testing>=0.8.1",
]


[tool.pdm.scripts]
dev = "flask run --host=localhost"
dbinit = "flask db init"
migrate = "flask db migrate"
upgrade = "flask db upgrade"
shell = "flask shell"
createsuperuser = "flask createsuperuser"
routes = "flask routes"
gcards = "flask gcards"
dcards = "flask dcards"
postman = "flask postman --export=True"
ptest = "flask test"
testc = "coverage run -m unittest discover tests/ -v"
coverage = "coverage report -m && coverage html"
exports = "pdm export -f requirements --without-hashes"
docker = "docker compose up --build"
mu = { composite = ["migrate", "upgrade"] }
test = { composite = ["testc", "coverage"] }
dg = { composite = ["dcards", "gcards"] }


[tool.ruff]
line-length = 130
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]


[tool.pdm]
distribution = false
